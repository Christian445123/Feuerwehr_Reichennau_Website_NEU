; ACHTUNG - befristete Sicherheits-Verschärfung (21.10.2026):
; Reaktion auf die kritischen PHP-Sicherheitslücken CVE-2026-109618 und
; CVE-2026-109619 ("php2shell", BSI-Sicherheitshinweis BITS-H
; 2026-297981-1132, CVSS 9.2, unauthentifizierte Remote Code Execution,
; betrifft praktisch alle PHP-Versionen). CVE-2026-109618 wird laut
; Advisory u.a. über große/speziell präparierte Upload-Anfragen ausgelöst
; (OOM-Speicherfehler) - die zuvor hier hinterlegten, bewusst sehr
; großzügigen Upload-Limits (bis 450MB pro Anfrage) vergrößern dieses
; Angriffsfenster unnötig. post_max_size/upload_max_filesize sind deshalb
; auf die von den PHP-Entwicklern empfohlenen Workaround-Werte reduziert,
; bis der eigentliche Patch (PHP 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35) auf dem
; Server eingespielt ist - das ist der einzige vollständige Schutz, diese
; Datei kann ihn nicht ersetzen. Bitte beim Hoster nachfragen, ob und wann
; gepatcht wurde (zu sehen unter Admin -> Einstellungen -> System-Info),
; und die alten, großzügigeren Werte danach gerne wieder herstellen -
; siehe Git-Historie dieser Datei.
;
; Wird nur von PHP-FPM/CGI-Hosting ausgelesen (bei klassischem mod_php
; ohne Wirkung, dann gelten die Standard-Limits des Hosters).
upload_max_filesize = 28M
post_max_size = 32M
max_file_uploads = 20
memory_limit = 512M
max_execution_time = 180
max_input_time = 180

; Workarounds aus dem PHP-Security-Advisory zu CVE-2026-109619 (Fehler im
; Umgang mit fatalen Fehlern/Backtraces über mehrere Anfragen hinweg) -
; schließt die Lücke nicht vollständig, blockiert aber den bisher
; bekannten Angriffsweg darüber.
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
