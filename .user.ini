; Höhere Upload-Limits, damit man mehrere (10+) Fotos auf einmal zu einem
; Bericht hinzufügen kann, ohne dass der Server die Anfrage stillschweigend
; verwirft. Wird nur von PHP-FPM/CGI-Hosting ausgelesen (bei klassischem
; mod_php ohne Wirkung, aber auch ohne Nachteil - dann gelten weiter die
; Standard-Limits des Hosters).
; upload_max_filesize gilt pro Datei (App-Grenze: 70MB, siehe
; config/database.php), post_max_size für die ganze Anfrage und muss daher
; deutlich höher sein, damit auch mehrere große Bilder auf einmal passen.
;
; Hinweis: Diese großzügigen Werte vergrößern laut BSI-Sicherheitshinweis
; BITS-H 2026-297981-1132 (CVE-2026-109618/109619, "php2shell") das
; Angriffsfenster, solange der Server noch nicht auf PHP 8.5.12 / 8.4.27 /
; 8.3.36 / 8.2.35 gepatcht ist - siehe Admin -> Einstellungen -> System-Info
; für die aktuell laufende PHP-Version. Bitte beim Hoster nachfragen, ob
; bereits gepatcht wurde.
upload_max_filesize = 75M
post_max_size = 450M
max_file_uploads = 40
memory_limit = 512M
max_execution_time = 180
max_input_time = 180

; Workarounds aus dem PHP-Security-Advisory zu CVE-2026-109619 (Fehler im
; Umgang mit fatalen Fehlern/Backtraces über mehrere Anfragen hinweg) -
; schließt die Lücke nicht vollständig, blockiert aber den bisher
; bekannten Angriffsweg darüber. Kostet nichts an Funktionalität, bleibt
; daher unabhängig von den Upload-Limits gesetzt.
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
