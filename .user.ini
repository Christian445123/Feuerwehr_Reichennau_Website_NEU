; Höhere Upload-Limits, damit man mehrere (10+) Fotos auf einmal zu einem
; Bericht hinzufügen kann, ohne dass der Server die Anfrage stillschweigend
; verwirft. Wird nur von PHP-FPM/CGI-Hosting ausgelesen (bei klassischem
; mod_php ohne Wirkung, aber auch ohne Nachteil - dann gelten weiter die
; Standard-Limits des Hosters).
; upload_max_filesize gilt pro Datei (App-Grenze: 70MB, siehe
; config/database.php), post_max_size für die ganze Anfrage und muss daher
; deutlich höher sein, damit auch mehrere große Bilder auf einmal passen.
upload_max_filesize = 75M
post_max_size = 450M
max_file_uploads = 40
memory_limit = 512M
max_execution_time = 180
max_input_time = 180
